---
#common configurations
mp:
  openapi:
    extensions:
      smallrye:
        info:
          title: "Book Microservice"
          version: "1.0"
          description: "Book Microservice API documentation"
          contact:
            name: "Quarkus"
            url: "https://quarkus.io/"
quarkus:
  http:
    cors:
      methods: GET,POST,PUT,DELETE
      origins: "*"

#dev configurations
"%dev":
  quarkus:
    http:
      port: 8667
    datasource:
      db-kind: mysql
      username: root
      password: root
      jdbc:
        url: jdbc:mysql://localhost:3306/adventure_works
    hibernate-orm:
      database:
        default-schema: adventure_works
        generation: update
    banner:
      enabled: true
    rest-client:
        number-ms:
           uri: "http://localhost:7667"
    smallrye-graphql-client:
      greet-ms:
         url: "http://localhost:6070/graphql"

#test configurations
"%test":
  quarkus:
    http:
      port: 8668
    hibernate-orm:
      database:
        generation: update
    live-reload:
      enabled: false
    banner:
      enabled: false


#prod configurations
"%prod":
  quarkus:
    http:
      port: 8669
    banner:
      enabled: true
    datasource:
      db-kind: mysql
      username: root
      password: root
      jdbc:
        url: jdbc:mysql://localhost:3306/adventure_works #changeit
    hibernate-orm:
      database:
        default-schema: adventure_works
        generation: update
    rest-client:
      number-ms:
        uri: "http://localhost:7667"
    smallrye-graphql-client:
      greet-ms:
        url: "http://localhost:6070/graphql"