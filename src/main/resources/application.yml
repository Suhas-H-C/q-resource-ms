---
#common configurations
mp:
  openapi:
    extensions:
      smallrye:
        info:
          title: "Book Microservice"
          version: "1.0"
          description: "Book Microservice API documentation"
          contact:
            name: "Quarkus"
            url: "https://quarkus.io/"
quarkus:
  http:
    cors:
      methods: GET,POST,PUT,DELETE
      origins: "*"

#dev configurations
"%dev":
  quarkus:
    http:
      port: 8667
    datasource:
      db-kind: mysql
      username: root
      password: root
      jdbc:
          url: jdbc:mysql://localhost:3306/adventure_works
          acquisition-timeout: 5s
          max-size: 10
          initial-size: 5
          min-size: 5
    hibernate-orm:
      database:
        generation: update
        default-schema: adventure_works
    banner:
      enabled: true
    rest-client:
      number-ms:
        uri: "http://localhost:7667"
    smallrye-graphql-client:
      greet-ms:
        url: "http://localhost:6070/graphql"