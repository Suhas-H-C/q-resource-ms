mp.openapi.extensions.smallrye.info.title=Resource Microservice
mp.openapi.extensions.smallrye.info.version=1.0
mp.openapi.extensions.smallrye.info.description=Resource Microservice API documentation
mp.openapi.extensions.smallrye.info.contact.name=Suhas H C
mp.openapi.extensions.smallrye.info.contact.url=https://quarkus.io/

quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE
quarkus.http.cors.origins=*
quarkus.http.port=8668

#Primary Datasource
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:test1;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS test1
quarkus.datasource.jdbc.acquisition-timeout=5s
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.initial-size=5
quarkus.datasource.jdbc.min-size=5
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.database.default-schema=test1
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.ignore-annotations=true
quarkus.hibernate-orm.packages=org.rest.resource.ms.entity
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=classpath:liquibase/db.mysql-changelog.json
quarkus.liquibase.database-change-log-table-name=Q_H2_TEST1_LIQUIBASE_CHANGELOG
quarkus.liquibase.database-change-log-lock-table-name=Q_H2_TEST1_LIQUIBASE_CHANGELOCK

#Secondary Datasource
quarkus.datasource.std.db-kind=h2
quarkus.datasource.std.username=sa
quarkus.datasource.std.password=
quarkus.datasource.std.jdbc.url=jdbc:h2:mem:test2;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS test2
quarkus.datasource.std.jdbc.acquisition-timeout=5s
quarkus.datasource.std.jdbc.max-size=6
quarkus.datasource.std.jdbc.initial-size=3
quarkus.datasource.std.jdbc.min-size=3
quarkus.hibernate-orm.std.datasource=std
quarkus.hibernate-orm.std.active=true
quarkus.hibernate-orm.std.database.generation=drop-and-create
quarkus.hibernate-orm.std.database.default-schema=test2
quarkus.hibernate-orm.std.sql-load-script=import.sql
quarkus.hibernate-orm.std.ignore-annotations=true
quarkus.hibernate-orm.std.packages=org.rest.resource.ms.pojo
quarkus.liquibase.std.datasource=std
quarkus.liquibase.std.migrate-at-start=true
quarkus.liquibase.std.change-log=classpath:liquibase/db.postgres-changelog.json
quarkus.liquibase.std.database-change-log-table-name=Q_H2_TEST2_LIQUIBASE_CHANGELOG
quarkus.liquibase.std.database-change-log-lock-table-name=Q_H2_TEST2_LIQUIBASE_CHANGELOCK


quarkus.banner.enabled=false
quarkus.rest-client.number-ms.uri=http://localhost:8221
quarkus.smallrye-graphql-client.greet-ms.url=http://localhost:8221/graphql