quarkus:
    http:
      port: 8668
    # Primary Datasource
    datasource:
      db-kind: mysql
      username: root
      password: root
      jdbc:
        url: jdbc:mysql://localhost:3306/adventure_works
        acquisition-timeout: 5s
        max-size: 10
        initial-size: 5
        min-size: 5
      # Secondary Datasource
      datasource2:
        db-kind: postgresql
        username: admin
        password: changeit
        jdbc:
          url: jdbc:postgresql://localhost:5423/postgres
          acquisition-timeout: 5s
          max-size: 6
          initial-size: 3
          min-size: 3
      hibernate-orm:
        database:
          generation: update
          default-schema: adventure_works
      hibername-orm2:
        datasource: postgres
        database:
          generation: update
          default-schema: postgres
        packages: org.rest.resource.ms.entity.Student
      banner:
        enabled: true
      rest-client:
        number-ms:
          uri: "http://localhost:7667"
      smallrye-graphql-client:
        greet-ms:
          url: "http://localhost:6070/graphql"
    live-reload:
      enabled: false
    banner:
      enabled: false