quarkus:
    http:
      port: 8668
    # Primary Datasource
    datasource:
      db-kind: h2
      username: sa
      password:
      jdbc:
        url: jdbc:h2:mem:test
        acquisition-timeout: 5s
        max-size: 10
        initial-size: 5
        min-size: 5
    hibernate-orm:
        database:
          generation: create
    rest-client:
      number-ms:
        uri: "http://localhost:7667"
    smallrye-graphql-client:
      greet-ms:
        url: "http://localhost:6070/graphql"
    live-reload:
      enabled: false
    banner:
      enabled: false